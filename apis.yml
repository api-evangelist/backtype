name: Backtype
description: BackType was a San Francisco social-media analytics startup (backed by 500 Startups/500
  Global) whose BackTweets product helped publishers measure the reach and conversion of their Tweets
  and content for clients including The New York Times, HubSpot, bitly, and SlideShare. The BackType team
  also built Storm, the distributed real-time stream-processing system later open-sourced as Apache Storm.
  Twitter acquired BackType on July 5, 2011 and folded the team into its platform group; the standalone
  product and public API were discontinued after the acquisition. The company is defunct and backtype.com
  is now a parked domain, so there is no live developer portal, documentation, or API surface to enrich.
